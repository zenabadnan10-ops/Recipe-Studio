<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Gemini_Generated_Image_rf5t81rf5t81rf5t-removebg-preview.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/css/style.css">
    <title>Recipe Studio</title>
  </head>
  <body>
    <header>
      <nav aria-label="Main navigation">
        <div id="logo-title">
          <img id="logo" src="/Gemini_Generated_Image_rf5t81rf5t81rf5t-removebg-preview.png" alt="website logo">
          <h1 id="title">
            Recipe Studio
          </h1>
        </div>
        <div id="nav-btns">
          <button class="nav-btn" id="add-recipe-btn">+ Add Recipe</button>
          <button class="nav-btn">🖤Favorites</button>
          <button class="nav-btn">All Recipes</button>
        </div>
      </nav>
    </header>
    <main>
      <section id="main-page" aria-labelledby="recipes-main-page">
        <div id="input-icon">
          <img src="./src/assets/images/search.png" id="search-icon" alt="search icon">
          <input type="search" id="search-input" placeholder="Search recipes..." aria-label="Search recipes">
        </div>
        <div id="filter-reset">
          <label for="filter">Filter:
            <select id="filter" name="filter-dropdown">
              <option value="all">All Recipes</option> 
              <option value="breakfast">Breakfast</option> 
              <option value="lunch">Lunch</option> 
              <option value="dinner">Dinner</option> 
              <option value="dessert">Dessert</option> 
              <option value="snack">Snacks</option> 
              <option value="drink">Drinks</option> 
            </select>
          </label>
          <button id="reset-filter">
            Reset Filter
          </button>
        </div>
      </section>
      <section id="recipes">
        <h1 id="filter-type">
          My Recipes
        </h1>
        <p class="no-recipes">
          No recipes yet
        </p>
        <p class="no-recipes">
          Add your first recipe to get started
        </p>
        <button class="no-recipes" id="add-btn">
          Add First Recipe
        </button>
        <div id="recipe-grid">
        </div>
      </section>
      <dialog id="recipe-dialog">
        <form id="add-form">
          <div id="name-url">
            <div id="name-div">
              <label for="recipe-name">Recipe Name</label>
              <input type="text" id="recipe-name" name="name" placeholder="e.g. Pasta" required>
            </div>
            <div id="url-div">
              <label for="recipe-img">Image URL</label>
              <input type="url" id="recipe-img" name="image">
            </div>
          </div>
          <label for="recipe-desc">Description</label>
          <textarea id="recipe-desc" name="desc" placeholder="Add description..."></textarea>
          <div id="serving-category">
            <div id="serving-div">
              <label for="servings">Servings</label>
              <input id="servings" min="1" name="servings" placeholder="e.g. 1" type="number">
            </div>
            <div id="category-div">
              <label for="recipe-category">Category</label>
              <select id="recipe-category" required name="category">
                <option value="">Choose Category</option> 
                <option value="breakfast">Breakfast</option> 
                <option value="lunch">Lunch</option> 
                <option value="dinner">Dinner</option> 
                <option value="dessert">Dessert</option> 
                <option value="snack">Snack</option> 
                <option value="drink">Drink</option> 
              </select>
            </div>
          </div>
          <label for="recipe-ingredients">Ingredients</label>
          <textarea id="recipe-ingredients" name="ingredients" placeholder="Enter one ingredient per line..." required></textarea>
          <label for="recipe-instructions">Instructions</label>
          <textarea id="recipe-instructions" name="instructions" placeholder="Enter one instruction per line..." required></textarea>
          <div id="form-btns">
            <button id="form-add-btn">Save Recipe</button>
            <button id="cancel-btn">Cancel</button>
          </div>
        </form>
      </dialog>
      <dialog id="view-recipe-dialog">
        <div id="dialog-image-div">
          <img id="dialog-image" alt="recipe image">
          <button type="button" id="cross-emoji">X</button>
        </div>
        <div id="dialog-desc-div">
          <img src="./src/assets/images/heart.png" alt="heart icon" id="dialog-recipe-heart">
          <h3 id="dialog-recipe-name"></h3>
          <h3 id="dialog-recipe-desc-heading">Description</h3>
          <p id="dialog-recipe-desc"></p>
          <div id="dialog-icons">
            <img src="./src/assets/images/user.png" alt="user icon" id="user-icon">
            <span id="dialog-recipe-serving"></span>
            <img src="./src/assets/images/tray.png" alt="tray icon" id="tray-icon">
            <span id="dialog-recipe-category"></span>
          </div>
          <h3 id="dialog-recipe-ingredient-heading">Ingredients</h3>
          <ul id="dialog-recipe-ingredient-list"></ul>
          <h3 id="dialog-recipe-instructions-heading">Instructions</h3>
          <ol id="dialog-recipe-instructions-list"></ol>
          <button id="edit-recipe-btn">Edit</button>
          <button id="delete-recipe-btn">Delete</button>
        </div>
      </dialog>
    </main>
    <footer>
      <p id="footer-title">
        Recipe Studio
      </p>
      <p id="footer-text">
        Built with HTML, CSS & JavaScript
      </p>
      <a href="https://github.com/zenabadnan10-ops/Recipe-Studio" id="github-link">
        GitHub
      </a>
      <p id="end-text">
        © 2026 Zenab Adnan
      </p>
    </footer>
    <script type="module" src="./src/js/main.js"></script>
  </body>
</html>
